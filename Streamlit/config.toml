# Tema fixo do painel — evita que o app "herde" o modo escuro do
# navegador/sistema do visitante e fique com contraste ruim.
# Este arquivo deve ficar na RAIZ do repositório (pasta .streamlit/,
# no mesmo nível onde o Streamlit Cloud lê o app), não dentro de data/.

[theme]
base = "light"
primaryColor = "#134E5E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F8"
textColor = "#1E293B"
font = "sans serif"
